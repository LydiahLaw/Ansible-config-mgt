---
- name: ensure wireshark is at the latest version
  package:
    name: wireshark
    state: latest

- name: create a directory
  file:
    path: /home/ansible_test
    state: directory
    mode: '0755'

- name: create a file inside the directory
  file:
    path: /home/ansible_test/test_file.txt
    state: touch
    mode: '0644'

- name: set timezone to Africa/Nairobi
  timezone:
    name: Africa/Nairobi
