---
- name: update web, nfs and db servers
  hosts: webservers, nfs, db
  become: yes
  tasks:
    - name: ensure wireshark is at the latest version
      yum:
        name: wireshark
        state: latest

    - name: create a directory
      file:
        path: /home/ec2-user/ansible_test
        state: directory
        mode: '0755'
        owner: ec2-user
        group: ec2-user

    - name: create a file inside the directory
      file:
        path: /home/ec2-user/ansible_test/test_file.txt
        state: touch
        mode: '0644'
        owner: ec2-user
        group: ec2-user

    - name: set timezone to Africa/Nairobi
      timezone:
        name: Africa/Nairobi

- name: update LB server
  hosts: lb
  become: yes
  tasks:
    - name: Update apt repo
      apt: 
        update_cache: yes

    - name: ensure wireshark is at the latest version
      apt:
        name: wireshark
        state: latest

    - name: create a directory
      file:
        path: /home/ubuntu/ansible_test
        state: directory
        mode: '0755'
        owner: ubuntu
        group: ubuntu

    - name: create a file inside the directory
      file:
        path: /home/ubuntu/ansible_test/test_file.txt
        state: touch
        mode: '0644'
        owner: ubuntu
        group: ubuntu

    - name: set timezone to Africa/Nairobi
      timezone:
        name: Africa/Nairobi