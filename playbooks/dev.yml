---
# Dev Environment Playbook
# Simple connectivity and basic setup

- name: Test connection to all dev servers
  hosts: all
  become: true
  gather_facts: true
  
  tasks:
    - name: Ping all servers
      ping:
    
    - name: Print hostname
      debug:
        msg: "Successfully connected to {{ inventory_hostname }}"
    
    - name: Update apt cache (Ubuntu/Debian)
      apt:
        update_cache: yes
      when: ansible_distribution in ["Ubuntu", "Debian"]
      
    - name: Update yum cache (RedHat/CentOS)
      yum:
        update_cache: yes
      when: ansible_distribution in ["RedHat", "CentOS"]
